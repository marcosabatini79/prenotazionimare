<html lang="it">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d4a60;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 16px; opacity: 0.9; margin-bottom: 18px; }
    a {
      color: #ffffff;
      font-weight: 600;
      text-decoration: underline;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Apertura di Prenotazioni Mare…</p>
    <a href="https://script.google.com/macros/s/AKfycbxXsnyE1QeJC4J1freVyFjGnzEgGhV0j1J2WVG0yri5D37O3tzuMovzXfKygQyOGGgR/exec">Se non si apre, tocca qui</a>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    // Redirect JS immediato: nessun iframe, quindi nessun problema di cookie di terze parti
    window.location.replace("https://script.google.com/macros/s/AKfycbxXsnyE1QeJC4J1freVyFjGnzEgGhV0j1J2WVG0yri5D37O3tzuMovzXfKygQyOGGgR/exec");
